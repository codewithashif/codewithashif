<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="700" height="200" role="img" aria-label="Trophy showcase">
  <defs>
    
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#150822"/><stop offset="100%" stop-color="#2b0f3f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5fa8"/><stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

  </defs>
  
  <style>
    .slideRow { opacity:0; animation: slideInKf .6s ease-out forwards; }
    @keyframes slideInKf { 0%{opacity:0; transform:translateX(-24px);} 100%{opacity:1; transform:translateX(0);} }
    .popCell { opacity:0; transform-box: fill-box; transform-origin:center; animation: popCellKf .55s cubic-bezier(.2,.9,.3,1.4) forwards; }
    @keyframes popCellKf { 0%{opacity:0; transform:scale(.5) translateY(14px);} 60%{opacity:1; transform:scale(1.06);} 100%{opacity:1; transform:scale(1) translateY(0);} }
    .shine { transform-box: fill-box; animation: shineKf 3.2s ease-in-out infinite; }
    @keyframes shineKf { 0%{transform:translateX(-150px);} 60%{transform:translateX(150px);} 100%{transform:translateX(150px);} }
    .glowPulse { animation: glowPulseKf 2.4s ease-in-out infinite; }
    @keyframes glowPulseKf { 0%,100%{opacity:.65;} 50%{opacity:1;} }
  </style>

  <rect width="700" height="200" rx="18" fill="url(#bg)" stroke="#ff6fd8" stroke-opacity="0.3"/>
  
    <g transform="translate(58.333333333333336,96)">
      <g class="popCell" style="animation-delay:0.20s">
        <clipPath id="shineClip0"><rect x="-58" y="-70" width="116" height="150" rx="14"/></clipPath>
        <rect x="-58" y="-70" width="116" height="150" rx="14" fill="#1e0e30" stroke="#ffd479" stroke-opacity="0.55"/>
        <circle cy="-18" r="30" fill="none" stroke="#ffd479" stroke-width="4" filter="url(#glow)"/>
        <text y="-9" text-anchor="middle" font-family="Georgia,serif" font-size="20" font-weight="800" fill="#ffd479">S</text>
        <text y="38" text-anchor="middle" font-family="Verdana,sans-serif" font-size="11" fill="#f6ecff">Stars</text>
        <g clip-path="url(#shineClip0)">
          <g transform="skewX(-20)">
            <rect class="shine" x="-30" y="-70" width="26" height="150" fill="#ffffff" opacity="0.18"/>
          </g>
        </g>
      </g>
    </g>
    <g transform="translate(175.0,96)">
      <g class="popCell" style="animation-delay:0.32s">
        <clipPath id="shineClip1"><rect x="-58" y="-70" width="116" height="150" rx="14"/></clipPath>
        <rect x="-58" y="-70" width="116" height="150" rx="14" fill="#1e0e30" stroke="#ff5fa8" stroke-opacity="0.55"/>
        <circle cy="-18" r="30" fill="none" stroke="#ff5fa8" stroke-width="4" filter="url(#glow)"/>
        <text y="-9" text-anchor="middle" font-family="Georgia,serif" font-size="20" font-weight="800" fill="#ff5fa8">A+</text>
        <text y="38" text-anchor="middle" font-family="Verdana,sans-serif" font-size="11" fill="#f6ecff">Commits</text>
        <g clip-path="url(#shineClip1)">
          <g transform="skewX(-20)">
            <rect class="shine" x="-30" y="-70" width="26" height="150" fill="#ffffff" opacity="0.18"/>
          </g>
        </g>
      </g>
    </g>
    <g transform="translate(291.6666666666667,96)">
      <g class="popCell" style="animation-delay:0.44s">
        <clipPath id="shineClip2"><rect x="-58" y="-70" width="116" height="150" rx="14"/></clipPath>
        <rect x="-58" y="-70" width="116" height="150" rx="14" fill="#1e0e30" stroke="#a855f7" stroke-opacity="0.55"/>
        <circle cy="-18" r="30" fill="none" stroke="#a855f7" stroke-width="4" filter="url(#glow)"/>
        <text y="-9" text-anchor="middle" font-family="Georgia,serif" font-size="20" font-weight="800" fill="#a855f7">A</text>
        <text y="38" text-anchor="middle" font-family="Verdana,sans-serif" font-size="11" fill="#f6ecff">Pull Requests</text>
        <g clip-path="url(#shineClip2)">
          <g transform="skewX(-20)">
            <rect class="shine" x="-30" y="-70" width="26" height="150" fill="#ffffff" opacity="0.18"/>
          </g>
        </g>
      </g>
    </g>
    <g transform="translate(408.3333333333333,96)">
      <g class="popCell" style="animation-delay:0.56s">
        <clipPath id="shineClip3"><rect x="-58" y="-70" width="116" height="150" rx="14"/></clipPath>
        <rect x="-58" y="-70" width="116" height="150" rx="14" fill="#1e0e30" stroke="#8fe9ff" stroke-opacity="0.55"/>
        <circle cy="-18" r="30" fill="none" stroke="#8fe9ff" stroke-width="4" filter="url(#glow)"/>
        <text y="-9" text-anchor="middle" font-family="Georgia,serif" font-size="20" font-weight="800" fill="#8fe9ff">B+</text>
        <text y="38" text-anchor="middle" font-family="Verdana,sans-serif" font-size="11" fill="#f6ecff">Issues</text>
        <g clip-path="url(#shineClip3)">
          <g transform="skewX(-20)">
            <rect class="shine" x="-30" y="-70" width="26" height="150" fill="#ffffff" opacity="0.18"/>
          </g>
        </g>
      </g>
    </g>
    <g transform="translate(525.0,96)">
      <g class="popCell" style="animation-delay:0.68s">
        <clipPath id="shineClip4"><rect x="-58" y="-70" width="116" height="150" rx="14"/></clipPath>
        <rect x="-58" y="-70" width="116" height="150" rx="14" fill="#1e0e30" stroke="#ff8fd0" stroke-opacity="0.55"/>
        <circle cy="-18" r="30" fill="none" stroke="#ff8fd0" stroke-width="4" filter="url(#glow)"/>
        <text y="-9" text-anchor="middle" font-family="Georgia,serif" font-size="20" font-weight="800" fill="#ff8fd0">B</text>
        <text y="38" text-anchor="middle" font-family="Verdana,sans-serif" font-size="11" fill="#f6ecff">Reviews</text>
        <g clip-path="url(#shineClip4)">
          <g transform="skewX(-20)">
            <rect class="shine" x="-30" y="-70" width="26" height="150" fill="#ffffff" opacity="0.18"/>
          </g>
        </g>
      </g>
    </g>
    <g transform="translate(641.6666666666667,96)">
      <g class="popCell" style="animation-delay:0.80s">
        <clipPath id="shineClip5"><rect x="-58" y="-70" width="116" height="150" rx="14"/></clipPath>
        <rect x="-58" y="-70" width="116" height="150" rx="14" fill="#1e0e30" stroke="#c68bff" stroke-opacity="0.55"/>
        <circle cy="-18" r="30" fill="none" stroke="#c68bff" stroke-width="4" filter="url(#glow)"/>
        <text y="-9" text-anchor="middle" font-family="Georgia,serif" font-size="20" font-weight="800" fill="#c68bff">C+</text>
        <text y="38" text-anchor="middle" font-family="Verdana,sans-serif" font-size="11" fill="#f6ecff">Experience</text>
        <g clip-path="url(#shineClip5)">
          <g transform="skewX(-20)">
            <rect class="shine" x="-30" y="-70" width="26" height="150" fill="#ffffff" opacity="0.18"/>
          </g>
        </g>
      </g>
    </g>
</svg>
