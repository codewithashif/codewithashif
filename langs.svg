<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="420" height="260" role="img" aria-label="Most used languages card">
  <defs>
    
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#150822"/><stop offset="100%" stop-color="#2b0f3f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5fa8"/><stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="cardClip2"><rect x="0" y="0" width="420" height="260" rx="18"/></clipPath>
  </defs>
  
  <style>
    .slideRow { opacity:0; animation: slideInKf .6s ease-out forwards; }
    @keyframes slideInKf { 0%{opacity:0; transform:translateX(-24px);} 100%{opacity:1; transform:translateX(0);} }
    .popCell { opacity:0; transform-box: fill-box; transform-origin:center; animation: popCellKf .55s cubic-bezier(.2,.9,.3,1.4) forwards; }
    @keyframes popCellKf { 0%{opacity:0; transform:scale(.5) translateY(14px);} 60%{opacity:1; transform:scale(1.06);} 100%{opacity:1; transform:scale(1) translateY(0);} }
    .shine { transform-box: fill-box; animation: shineKf 3.2s ease-in-out infinite; }
    @keyframes shineKf { 0%{transform:translateX(-150px);} 60%{transform:translateX(150px);} 100%{transform:translateX(150px);} }
    .glowPulse { animation: glowPulseKf 2.4s ease-in-out infinite; }
    @keyframes glowPulseKf { 0%,100%{opacity:.65;} 50%{opacity:1;} }
  </style>

  <g clip-path="url(#cardClip2)">
    <rect width="420" height="260" fill="url(#bg)"/>
    <text x="24" y="34" font-family="Verdana,sans-serif" font-size="14" font-weight="700" fill="#f6ecff">Most Used Languages</text>
    
    <g class="slideRow" style="animation-delay:0.30s">
      <text x="24" y="68" font-family="Verdana,sans-serif" font-size="12" fill="#c9a8e0">HTML</text>
      <text x="396" y="68" text-anchor="end" font-family="Verdana,sans-serif" font-size="12" fill="#ff8fd0">30%</text>
      <rect x="24" y="74" width="372" height="8" rx="4" fill="#1e0e30"/>
      <rect x="24" y="74" width="0" height="8" rx="4" fill="#e34c26">
        <animate attributeName="width" from="0" to="111.6" begin="0.80s" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.22 0.61 0.36 1"/>
      </rect>
    </g>
    <g class="slideRow" style="animation-delay:0.45s">
      <text x="24" y="98" font-family="Verdana,sans-serif" font-size="12" fill="#c9a8e0">CSS</text>
      <text x="396" y="98" text-anchor="end" font-family="Verdana,sans-serif" font-size="12" fill="#ff8fd0">22%</text>
      <rect x="24" y="104" width="372" height="8" rx="4" fill="#1e0e30"/>
      <rect x="24" y="104" width="0" height="8" rx="4" fill="#563d7c">
        <animate attributeName="width" from="0" to="81.8" begin="0.95s" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.22 0.61 0.36 1"/>
      </rect>
    </g>
    <g class="slideRow" style="animation-delay:0.60s">
      <text x="24" y="128" font-family="Verdana,sans-serif" font-size="12" fill="#c9a8e0">JavaScript</text>
      <text x="396" y="128" text-anchor="end" font-family="Verdana,sans-serif" font-size="12" fill="#ff8fd0">21%</text>
      <rect x="24" y="134" width="372" height="8" rx="4" fill="#1e0e30"/>
      <rect x="24" y="134" width="0" height="8" rx="4" fill="#f1e05a">
        <animate attributeName="width" from="0" to="78.1" begin="1.10s" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.22 0.61 0.36 1"/>
      </rect>
    </g>
    <g class="slideRow" style="animation-delay:0.75s">
      <text x="24" y="158" font-family="Verdana,sans-serif" font-size="12" fill="#c9a8e0">Java</text>
      <text x="396" y="158" text-anchor="end" font-family="Verdana,sans-serif" font-size="12" fill="#ff8fd0">16%</text>
      <rect x="24" y="164" width="372" height="8" rx="4" fill="#1e0e30"/>
      <rect x="24" y="164" width="0" height="8" rx="4" fill="#b07219">
        <animate attributeName="width" from="0" to="59.5" begin="1.25s" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.22 0.61 0.36 1"/>
      </rect>
    </g>
    <g class="slideRow" style="animation-delay:0.90s">
      <text x="24" y="188" font-family="Verdana,sans-serif" font-size="12" fill="#c9a8e0">C</text>
      <text x="396" y="188" text-anchor="end" font-family="Verdana,sans-serif" font-size="12" fill="#ff8fd0">11%</text>
      <rect x="24" y="194" width="372" height="8" rx="4" fill="#1e0e30"/>
      <rect x="24" y="194" width="0" height="8" rx="4" fill="#555555">
        <animate attributeName="width" from="0" to="40.9" begin="1.40s" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.22 0.61 0.36 1"/>
      </rect>
    </g>
  </g>
  <rect x="1" y="1" width="418" height="258" rx="17" fill="none" stroke="#ff6fd8" stroke-opacity="0.3"/>
</svg>
